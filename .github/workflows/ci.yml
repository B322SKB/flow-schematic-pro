name: CI

on:
  push:
    branches:
      - main
      - feature/pid-onprem-poc
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: pid_test
      PGUSER: pid_test
      PGPASSWORD: pid_test_password
      PGCONNECT_TIMEOUT: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pid_test
          POSTGRES_USER: pid_test
          POSTGRES_PASSWORD: pid_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pid_test -d pid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/001_initial_schema.sql
      - name: Run unit tests
        run: bun run test
      - name: Check Windows install package
        shell: pwsh
        run: ./deploy/windows/test-package.ps1
      - name: Build application
        run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify standalone Node server and PostgreSQL API
        run: |
          test -f .output/server/index.mjs
          node .output/server/index.mjs > /tmp/pid-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              node scripts/api-smoke.mjs
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pid-server.log
          exit 1
      - name: Package Windows on-prem installation bundle
        run: git archive --format=zip --output=pid-flow-pro-windows-onprem.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pid-flow-pro-windows-onprem
          path: pid-flow-pro-windows-onprem.zip
          if-no-files-found: error
